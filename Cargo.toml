[package]
name = "charming-x-ansi"
version = "0.0.0-20260812000000"
edition = "2021"
description = "Cleanroom Rust port of Charmbracelet's x/ansi module from the charmbracelet/x monorepo, pinned to upstream release ansi/v0.11.7 (pseudo-version 20260703014108)"
license = "MIT"

[dependencies]
unicode-segmentation = "1.10.1"
unicode-width = { version = "0.1", features = ["cjk"] }
libc = "0.2"

[dev-dependencies]

[lib]
name = "charming_x_ansi"
path = "src/lib.rs"
